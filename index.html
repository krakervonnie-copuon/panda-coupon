<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美食外送優惠券</title>
<meta property="og:title" content="美食外送優惠券領取">
<meta property="og:description" content="美食外送—$80優惠券 & 5折優惠券，限時領取">
<meta property="og:image" content="preview.png">
<meta name="twitter:card" content="summary_large_image">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif;background:#f2f2f2}</style>
</head>
<body class="flex justify-center min-h-screen">
<div class="w-full max-w-[480px] bg-[#f2f2f2] min-h-screen pt-4">
  <div class="px-3 space-y-3">
    <div id="couponCard1" class="bg-white rounded-[16px] border border-[#e5e5e5] overflow-hidden cursor-pointer shadow-sm">
      <div class="p-4 flex gap-3">
        <div class="w-[48px] h-[36px] bg-[#E91E8C] rounded-[8px] flex items-center justify-center text-white text-[20px] mt-1">🎟️</div>
        <div class="flex-1">
          <p class="font-bold text-[15px] leading-5">美食外送—$80 優惠券—指定消費者適用</p>
          <div class="flex items-center gap-2 mt-2">
            <span class="font-black text-[22px]">$ 80</span>
            <span class="w-6 h-6 rounded-full border border-[#E91E8C] text-[#E91E8C] flex items-center justify-center text-[12px] font-bold">i</span>
          </div>
        </div>
      </div>
      <div class="border-t border-dashed border-[#ddd] mx-2"></div>
      <div class="px-4 py-3 flex items-center justify-between">
        <div class="bg-[#f7f7f7] rounded-full px-3 py-1.5 text-[12px] flex items-center gap-2">
          <span>最低消費金額$ 99</span><span class="w-1 h-1 bg-[#bbb] rounded-full"></span><span class="text-[#E64A19] font-bold">將於24小時內到期</span>
        </div>
        <span class="font-bold text-[15px]">立即使用</span>
      </div>
    </div>
    <div id="couponCard2" class="bg-white rounded-[16px] border border-[#e5e5e5] overflow-hidden cursor-pointer shadow-sm">
      <div class="p-4 flex gap-3">
        <div class="w-[48px] h-[36px] bg-[#E91E8C] rounded-[8px] flex items-center justify-center text-white text-[20px] mt-1">🎟️</div>
        <div class="flex-1">
          <p class="font-bold text-[15px] leading-5">美食外送-5折優惠券 - 指定用戶適用</p>
          <div class="flex items-center gap-2 mt-2">
            <span class="font-black text-[22px]">5折</span>
          </div>
        </div>
      </div>
      <div class="border-t border-dashed border-[#ddd] mx-2"></div>
      <div class="px-4 py-3 flex items-center justify-between">
        <div class="bg-[#f7f7f7] rounded-full px-3 py-1.5 text-[12px] flex items-center gap-2">
          <span>最低消費金額$100</span><span class="w-1 h-1 bg-[#bbb] rounded-full"></span><span class="text-[#E64A19] font-bold">將於24小時內到期</span>
        </div>
        <span class="font-bold text-[15px]">立即使用</span>
      </div>
    </div>
  </div>
</div>
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center">
  <div class="bg-white rounded-t-[20px] sm:rounded-[20px] w-full max-w-[480px] max-h-[90vh] overflow-y-auto">
    <div class="flex justify-center pt-3 pb-2"><div class="w-10 h-1.5 bg-[#ddd] rounded-full"></div></div>
    <div class="px-5 pb-6">
      <h3 class="font-bold text-[16px]">優惠券詳情</h3>
      <div class="mt-4 flex gap-3">
        <div class="text-[#E91E8C] text-[22px]">🎟️</div>
        <div class="flex-1">
          <p class="font-bold text-[15px] leading-5">美食外送-5折優惠券 - 指定用戶適用^</p>
          <p class="text-[13px] text-[#555] mt-1">新客與既有顧客<br>於 26 9月 2026至30 9月 2026 間有效</p>
          <div class="flex gap-2 mt-3">
            <span class="bg-[#FFE6F0] text-[#E91E8C] text-[12px] px-3 py-1 rounded-full font-bold">美食</span>
            <span class="bg-[#FFE6F0] text-[#E91E8C] text-[12px] px-3 py-1 rounded-full font-bold">外送</span>
          </div>
        </div>
      </div>
      <div class="h-[1px] bg-[#eee] my-5"></div>
      <h4 class="font-bold text-[14px]">服務條款與細則</h4>
      <ul class="mt-3 text-[13px] leading-6 text-[#333] space-y-2 list-disc pl-5">
        <li>適用於最低消費$100以上之訂單</li>
        <li>可於外送使用。</li>
        <li>每名顧客僅限兌換1次</li>
        <li>僅限特定使用者。</li>
      </ul>
      <button id="goClaim" class="mt-6 w-full bg-[#E64A19] text-white font-bold py-4 rounded-[12px] text-[16px]">前往領取優惠券</button>
      <button id="closeModal" class="mt-3 w-full bg-[#f0f0f0] text-[#666] font-bold py-3.5 rounded-[12px]">返回</button>
    </div>
  </div>
</div>
<script>
  function openModal(){document.getElementById('modal').classList.remove('hidden');}
  document.getElementById('couponCard1').onclick=openModal;
  document.getElementById('couponCard2').onclick=openModal;
  document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.add('hidden');
  document.getElementById('modal').onclick=(e)=>{if(e.target.id==='modal')e.currentTarget.classList.add('hidden');}
  document.getElementById('goClaim').onclick=()=>window.location.href='https://lin.ee/UIqQlvi';
</script>
</body>
</html>
